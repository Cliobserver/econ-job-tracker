# Daily refresh of the job listings (see README).
name: Update job listings

on:
  schedule:
    # Every third day, targeting 12:00 America/Los_Angeles (19:00 UTC during PDT, 20:00 UTC
    # during PST). GitHub often starts scheduled runs one to three hours late, so the gate below
    # does NOT require an exact hour: it runs whenever the data has not been refreshed yet today
    # (Los Angeles date). The second cron is then skipped automatically.
    # "*/3" on day-of-month runs on the 1st, 4th, 7th, ... so the gap at a month boundary can be
    # one day shorter or longer than three days.
    - cron: "0 19 */3 * *"
    - cron: "0 20 */3 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-listings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gate (skip if already refreshed today; manual runs always proceed)
        id: gate
        run: |
          TODAY=$(TZ=America/Los_Angeles date +%F)
          LAST=$(python3 -c "import json,sys; print(json.load(open('data/jobs.json')).get('updated') or '')" 2>/dev/null || echo "")
          echo "today=$TODAY last_update=$LAST event=${{ github.event_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$LAST" != "$TODAY" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Already refreshed today; skipping."
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Fetch, tag, and render
        if: steps.gate.outputs.run == 'true'
        env:
          # Optional: enables Claude-based extraction for free-text postings (Chronicle, Substack).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional: Gmail mailing-list ingestion (RESECON, CWAE, AAEA, ARE Grads) over IMAP OAuth.
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python -m src.run

      - name: Commit results
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs README.md
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update listings $(TZ=America/Los_Angeles date +%F)"
            git push
          fi
